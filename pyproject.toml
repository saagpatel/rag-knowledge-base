[project]
name = "rag-kb"
version = "0.1.0"
description = "100% local RAG knowledge base system — ingest, chunk, embed, search, and ask questions against your documents using Ollama + Qdrant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "qdrant-client>=1.13",
    "click>=8.1",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tqdm>=4.66",
    "cuid2>=2.0",
    "pymupdf>=1.24",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.13",
    "beautifulsoup4>=4.12",
    "chardet>=5.2",
    "fastmcp>=3.2.0",
]

[project.scripts]
rag = "rag_kb.cli:main"
rag-kb-mcp = "rag_kb.mcp:run"

[project.urls]
Homepage = "https://github.com/your-org/rag-knowledge-base"
Repository = "https://github.com/your-org/rag-knowledge-base"
Documentation = "https://github.com/your-org/rag-knowledge-base/tree/main/docs"

[dependency-groups]
reranker = ["sentence-transformers>=2.6"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "black>=26.3.1",
    "isort>=5.13",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_kb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires running Ollama and Qdrant services"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
