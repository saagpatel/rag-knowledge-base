# Production stack: API + Qdrant + Nginx
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # --- API server (Python + built React UI) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-kb-api
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - RAG_QDRANT__HOST=qdrant
      - RAG_QDRANT__PORT=6333
      - RAG_SQLITE__PATH=/app/data/rag_kb.db
      - RAG_LOGGING__FILE=/app/logs/rag_kb.log
      - RAG_SERVER__HOST=0.0.0.0
    volumes:
      - api_data:/app/data
      - api_logs:/app/logs
    networks:
      - rag-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Qdrant overrides for production ---
  qdrant:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - QDRANT__TELEMETRY_DISABLED=true

  # --- Nginx reverse proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: rag-kb-nginx
    depends_on:
      - api
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rag-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api_data:
    name: rag-kb-api-data
  api_logs:
    name: rag-kb-api-logs
